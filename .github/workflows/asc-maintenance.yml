name: asc-maintenance

# TEMPORARY branch variant (ci/asc-submit-195): submit the staged 1.9.5 review submission.
# Finds the draft (READY_FOR_REVIEW) review submission, verifies its item is version 1.9.5,
# then PATCHes submitted=true. Refuses to act on anything else; creates nothing unless the
# draft is missing entirely (then it stages 1.9.5 itself before submitting).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-195:
    runs-on: ubuntu-latest
    steps:
      - name: Submit staged 1.9.5 for review
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import jwt, json, os, sys, time, urllib.request

          TARGET = "1.9.5"

          key = __import__("base64").b64decode(os.environ["ASC_KEY_P8"]).decode()
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]

          def token():
              now = int(time.time())
              return jwt.encode({"iss": iss, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": kid})

          def call(path, method="GET", body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           method=method,
                                           data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", f"Bearer {token()}")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          st, data = call("/v1/apps?filter[bundleId]=com.panda.ccpocket&fields[apps]=bundleId")
          if st != 200 or not data.get("data"):
              print(f"::error::app lookup failed ({st})"); sys.exit(1)
          app_id = data["data"][0]["id"]
          print(f"app id: {app_id}")

          # List every submission; the rejected one (UNRESOLVED_ISSUES) still owns 1.9.5.
          st, data = call(f"/v1/reviewSubmissions?filter[app]={app_id}&limit=10"
                          "&fields[reviewSubmissions]=platform,state,submittedDate")
          subs = data.get("data", []) if st == 200 else []
          target_sub, strays = None, []
          for s in subs:
              a = s["attributes"]
              ist, idata = call(f"/v1/reviewSubmissions/{s['id']}/items?limit=10&include=appStoreVersion"
                                "&fields[appStoreVersions]=versionString")
              vers = [i["attributes"].get("versionString") for i in idata.get("included", [])
                      if i["type"] == "appStoreVersions"]
              print(f"sub {s['id']} state={a.get('state')} items={vers}")
              if a.get("state") in ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW") and vers == [TARGET]:
                  target_sub = s
              elif a.get("state") == "READY_FOR_REVIEW" and not vers:
                  strays.append(s["id"])

          # Cancel the empty draft(s) accidentally created by the previous run.
          for sid in strays:
              st, cdata = call(f"/v1/reviewSubmissions/{sid}", "PATCH", {
                  "data": {"type": "reviewSubmissions", "id": sid, "attributes": {"canceled": True}}})
              print(f"cancel stray {sid} -> {st}")

          if target_sub is None:
              print(f"::error::no submission holding exactly [{TARGET}] in a resubmittable state"); sys.exit(1)
          sub_id = target_sub["id"]
          print(f"resubmitting {sub_id} (state={target_sub['attributes'].get('state')})")

          st, pdata = call(f"/v1/reviewSubmissions/{sub_id}", "PATCH", {
              "data": {"type": "reviewSubmissions", "id": sub_id, "attributes": {"submitted": True}}})
          if st != 200:
              print(f"::error::submit failed ({st}): {json.dumps(pdata)[:1200]}"); sys.exit(1)
          print(f"PATCH ok -> state={pdata['data']['attributes'].get('state')}")

          st, data = call(f"/v1/reviewSubmissions/{sub_id}?fields[reviewSubmissions]=state,submittedDate")
          a = data.get("data", {}).get("attributes", {})
          print(f"final: state={a.get('state')} submittedDate={a.get('submittedDate')}")
          PY
