name: asc-maintenance

# TEMPORARY branch variant (ci/asc-submit-195): submit the staged 1.9.5 review submission.
# Finds the draft (READY_FOR_REVIEW) review submission, verifies its item is version 1.9.5,
# then PATCHes submitted=true. Refuses to act on anything else; creates nothing unless the
# draft is missing entirely (then it stages 1.9.5 itself before submitting).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-195:
    runs-on: ubuntu-latest
    steps:
      - name: Submit staged 1.9.5 for review
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import jwt, json, os, sys, time, urllib.request

          TARGET = "1.9.5"

          key = __import__("base64").b64decode(os.environ["ASC_KEY_P8"]).decode()
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]

          def token():
              now = int(time.time())
              return jwt.encode({"iss": iss, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": kid})

          def call(path, method="GET", body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           method=method,
                                           data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", f"Bearer {token()}")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          st, data = call("/v1/apps?filter[bundleId]=com.panda.ccpocket&fields[apps]=bundleId")
          if st != 200 or not data.get("data"):
              print(f"::error::app lookup failed ({st})"); sys.exit(1)
          app_id = data["data"][0]["id"]
          print(f"app id: {app_id}")

          # Locate the draft submission ("可供审核" in the UI).
          st, data = call(f"/v1/reviewSubmissions?filter[app]={app_id}&filter[state]=READY_FOR_REVIEW&limit=8"
                          "&fields[reviewSubmissions]=platform,state,submittedDate")
          drafts = data.get("data", []) if st == 200 else []
          print(f"draft submissions: {[d['id'] for d in drafts]}")

          sub_id = None
          if len(drafts) > 1:
              print("::error::more than one draft submission — refusing to guess"); sys.exit(1)

          if drafts:
              sub_id = drafts[0]["id"]
              st, idata = call(f"/v1/reviewSubmissions/{sub_id}/items?limit=10&include=appStoreVersion"
                               "&fields[appStoreVersions]=versionString")
              vers = [i["attributes"].get("versionString") for i in idata.get("included", [])
                      if i["type"] == "appStoreVersions"]
              print(f"draft {sub_id} contains versions: {vers}")
              if vers != [TARGET]:
                  print(f"::error::draft does not contain exactly {TARGET} — refusing"); sys.exit(1)
          else:
              # No draft: stage 1.9.5 ourselves (resubmission after rejection).
              st, vdata = call(f"/v1/apps/{app_id}/appStoreVersions?filter[versionString]={TARGET}&filter[platform]=IOS"
                               "&fields[appStoreVersions]=versionString,appVersionState")
              if st != 200 or not vdata.get("data"):
                  print(f"::error::version {TARGET} lookup failed ({st})"); sys.exit(1)
              ver = vdata["data"][0]
              print(f"version {TARGET} id={ver['id']} state={ver['attributes'].get('appVersionState')}")
              st, sdata = call("/v1/reviewSubmissions", "POST", {
                  "data": {"type": "reviewSubmissions",
                           "attributes": {"platform": "IOS"},
                           "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}})
              if st not in (200, 201):
                  print(f"::error::create submission failed ({st}): {json.dumps(sdata)[:800]}"); sys.exit(1)
              sub_id = sdata["data"]["id"]
              st, idata = call("/v1/reviewSubmissionItems", "POST", {
                  "data": {"type": "reviewSubmissionItems",
                           "relationships": {
                               "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                               "appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver["id"]}}}}})
              if st not in (200, 201):
                  print(f"::error::add item failed ({st}): {json.dumps(idata)[:800]}"); sys.exit(1)
              print(f"staged new submission {sub_id} with {TARGET}")

          # The actual submit.
          st, pdata = call(f"/v1/reviewSubmissions/{sub_id}", "PATCH", {
              "data": {"type": "reviewSubmissions", "id": sub_id, "attributes": {"submitted": True}}})
          if st != 200:
              print(f"::error::submit failed ({st}): {json.dumps(pdata)[:1200]}"); sys.exit(1)
          print(f"PATCH ok -> state={pdata['data']['attributes'].get('state')}")

          # Confirm final state.
          st, data = call(f"/v1/reviewSubmissions/{sub_id}?fields[reviewSubmissions]=state,submittedDate")
          a = data.get("data", {}).get("attributes", {})
          print(f"final: state={a.get('state')} submittedDate={a.get('submittedDate')}")
          PY
