name: asc-maintenance

# TEMPORARY branch variant (ci/asc-review-status): read-only App Store review status probe.
# The purge-dev-certs job from main is intentionally absent here — dispatching this branch
# can never revoke anything. Prints only version/review states (no metadata, no reasons).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-status:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store version + review submission states
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import jwt, json, os, sys, time, urllib.request

          key = __import__("base64").b64decode(os.environ["ASC_KEY_P8"]).decode()
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]

          def token():
              now = int(time.time())
              return jwt.encode({"iss": iss, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": kid})

          def call(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path)
              req.add_header("Authorization", f"Bearer {token()}")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          st, data = call("/v1/apps?filter[bundleId]=com.panda.ccpocket&fields[apps]=bundleId")
          if st != 200 or not data.get("data"):
              print(f"::error::app lookup failed ({st})"); sys.exit(1)
          app_id = data["data"][0]["id"]
          print(f"app id: {app_id}\n")

          print("== appStoreVersions (newest first) ==")
          st, data = call(f"/v1/apps/{app_id}/appStoreVersions?limit=6"
                          "&fields[appStoreVersions]=versionString,appStoreState,appVersionState,platform,createdDate")
          for v in data.get("data", []):
              a = v["attributes"]
              print(f"{a.get('platform','?'):<6} {a.get('versionString','?'):<8} "
                    f"state={a.get('appVersionState') or a.get('appStoreState')}  created={a.get('createdDate')}  id={v['id']}")

          print("\n== reviewSubmissions ==")
          st, data = call(f"/v1/reviewSubmissions?filter[app]={app_id}&limit=8"
                          "&fields[reviewSubmissions]=platform,state,submittedDate")
          for s in data.get("data", []):
              a = s["attributes"]
              print(f"{a.get('platform','?'):<6} state={a.get('state'):<22} submitted={a.get('submittedDate')}  id={s['id']}")
              ist, idata = call(f"/v1/reviewSubmissions/{s['id']}/items?limit=10&include=appStoreVersion"
                                "&fields[appStoreVersions]=versionString")
              vers = {i["id"]: i["attributes"].get("versionString") for i in idata.get("included", []) if i["type"] == "appStoreVersions"}
              for it in idata.get("data", []):
                  rel = (((it.get("relationships") or {}).get("appStoreVersion") or {}).get("data") or {})
                  print(f"   item state={it['attributes'].get('state'):<12} version={vers.get(rel.get('id'), '?')}")

          print("\n== recent builds / TestFlight beta review ==")
          st, data = call(f"/v1/builds?filter[app]={app_id}&sort=-uploadedDate&limit=6"
                          "&fields[builds]=version,uploadedDate,processingState"
                          "&include=betaAppReviewSubmission,preReleaseVersion"
                          "&fields[betaAppReviewSubmissions]=betaReviewState,submittedDate"
                          "&fields[preReleaseVersions]=version")
          beta = {i["id"]: i["attributes"] for i in data.get("included", []) if i["type"] == "betaAppReviewSubmissions"}
          pre = {i["id"]: i["attributes"].get("version") for i in data.get("included", []) if i["type"] == "preReleaseVersions"}
          for b in data.get("data", []):
              a = b["attributes"]
              rels = b.get("relationships") or {}
              bid = ((rels.get("betaAppReviewSubmission") or {}).get("data") or {}).get("id")
              pid = ((rels.get("preReleaseVersion") or {}).get("data") or {}).get("id")
              bs = beta.get(bid, {})
              print(f"v{pre.get(pid,'?'):<8} build {a.get('version','?'):<6} uploaded={a.get('uploadedDate')} "
                    f"processing={a.get('processingState')} betaReview={bs.get('betaReviewState','-')}")

          # Speculative: resolution-center-ish endpoints (expected 4xx if unsupported; harmless probe).
          print("\n== resolution center probes ==")
          for p in (f"/v1/resolutionCenterThreads?filter[app]={app_id}",
                    f"/v1/apps/{app_id}/resolutionCenterThreads"):
              st, data = call(p)
              print(f"GET {p} -> {st}")
              if st == 200:
                  print(json.dumps(data, ensure_ascii=False)[:2000])
          PY
